[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glpi-rest"
version = "0.1.0"
description = "Typed Python client for the GLPI REST API (GLPI 10 and 11)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Novagios", email = "contact@novagios.com" }]
keywords = ["glpi", "itsm", "itil", "api", "client", "asset-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "requests-mock>=1.12",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/novagiosAI/glpi-rest"
Repository = "https://github.com/novagiosAI/glpi-rest"
Issues = "https://github.com/novagiosAI/glpi-rest/issues"
Changelog = "https://github.com/novagiosAI/glpi-rest/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/glpi_rest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/glpi_rest"]
